name: Dependency Hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          mkdir -p tmp
          audit_status=0
          npm audit --json > tmp/npm-audit.json || audit_status=$?
          node scripts/audit-report.mjs tmp/npm-audit.json --fail-on-vulnerabilities
          if [ "$audit_status" -ne 0 ]; then
            echo "npm audit exited with status $audit_status" >&2
            exit "$audit_status"
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-hygiene-audit-report
          path: tmp/npm-audit.json

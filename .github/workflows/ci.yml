name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use the pinned npm
        run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: npm ci

      - name: Run aggregate checks
        run: make check

      - name: Collect npm audit report
        run: |
          mkdir -p tmp
          audit_status=0
          npm audit --json > tmp/npm-audit.json || audit_status=$?
          node scripts/audit-report.mjs tmp/npm-audit.json
          if [ "$audit_status" -gt 1 ]; then
            echo "npm audit failed with status $audit_status" >&2
            exit "$audit_status"
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-report
          path: tmp/npm-audit.json

  fresh-clone-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use the pinned npm
        run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Verify from a fresh workspace copy
        run: npm run verify:fresh-clone

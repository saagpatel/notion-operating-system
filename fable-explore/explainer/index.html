<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One Writer, No Lies — an interactive explainer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2324566d'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="explainer">
  <header class="explainer-header">
    <h1>One Writer, No Lies</h1>
    <p class="kicker">Rent the view. Own the truth.</p>
  </header>

  <nav class="act-tabs" role="tablist" aria-label="Explainer acts">
    <button id="act-1-tab" class="act-tab" type="button" role="tab" aria-controls="simulation" aria-selected="true">Act 1 <span>the naive sync</span></button>
    <button id="act-2-tab" class="act-tab" type="button" role="tab" aria-controls="simulation" aria-selected="false">Act 2 <span>one writer per field</span></button>
    <button id="act-3-tab" class="act-tab" type="button" role="tab" aria-controls="simulation" aria-selected="false">Act 3 <span>the outbox &amp; receipt</span></button>
    <button id="act-4-tab" class="act-tab" type="button" role="tab" aria-controls="simulation" aria-selected="false">Act 4 <span>the ladder</span></button>
    <button id="act-5-tab" class="act-tab" type="button" role="tab" aria-controls="simulation" aria-selected="false">Act 5 <span>drift and dry run</span></button>
    <button id="act-6-tab" class="act-tab" type="button" role="tab" aria-controls="simulation" aria-selected="false">Act 6 <span>chaos mode</span></button>
  </nav>

  <div class="beat-status">
    <span id="beat-label">ACT 1 · BEAT 1 OF 3</span>
    <span id="rule-label">append on arrival · no key check</span>
  </div>

  <div id="simulation" class="simulation" role="tabpanel" aria-live="off">
    <div class="panels">
      <section class="panel panel-local" aria-label="LOCAL — the truth">
        <h2>LOCAL <span class="panel-sub">the truth</span></h2>
        <div id="project-cards" class="project-cards"></div>
        <div id="special-local" class="special-panel"></div>
        <div class="outbox">
          <h3>outbox <span id="outbox-count">0 rows</span></h3>
          <ul id="outbox-list" class="outbox-list"></ul>
        </div>
      </section>

      <div class="wire" aria-hidden="true">
        <p class="wire-label">THE WIRE</p>
        <div id="wire-track" class="wire-track"></div>
      </div>

      <section class="panel panel-remote" aria-label="REMOTE — the view">
        <h2>REMOTE <span class="panel-sub">the view</span></h2>
        <div class="remote">
          <h3>record <span id="remote-count">0 pages</span></h3>
          <ul id="remote-list" class="remote-list"></ul>
        </div>
        <div id="special-remote" class="special-panel"></div>
      </section>
    </div>

    <div class="controls">
      <button id="sync-button" class="button button-primary" type="button">▶ run one sync pass</button>
      <button id="again-button" class="button button-secondary" type="button">⟳ run again</button>
      <button id="reset-button" class="button button-quiet" type="button">↺ reset</button>
      <div id="toggle-controls" class="toggle-controls" aria-label="Failure injectors"></div>
    </div>

    <section class="narrative" aria-live="polite">
      <p id="beat-copy" class="beat-copy"></p>
      <div id="prediction" class="prediction" hidden></div>
      <div id="reveal" class="reveal" hidden></div>
      <button id="next-button" class="button button-next" type="button">next →</button>
    </section>

    <ol id="event-log" class="event-log" aria-live="polite" aria-relevant="additions text"></ol>
  </div>
</main>

<script type="module" src="dist/explainer.js"></script>
</body>
</html>

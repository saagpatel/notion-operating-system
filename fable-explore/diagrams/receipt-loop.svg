<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The receipt loop closes the crash window</title>
  <desc id="desc">An outbox row creates a remote page and receives the page id back as downstreamRef. Before the sync-key repair, a crash after create but before receipt could duplicate the page on retry. After the repair, retry queries by key and writes only the missing receipt.</desc>
  <style>.bg{fill:#fffdf8}.ink{fill:#24292e}.muted{fill:#6b7280}.local{fill:#fbf4e7;stroke:#8a5a2b}.remote{fill:#f2f8fa;stroke:#24566d}.danger{fill:#fff1ef;stroke:#a23331}.good{fill:#eef8ef;stroke:#2f7d46}.card{stroke-width:2}.title{font:700 42px system-ui,sans-serif}.sub{font:18px system-ui,sans-serif}.label{font:700 19px system-ui,sans-serif}.body{font:16px system-ui,sans-serif}.mono{font:14px ui-monospace,monospace}.line{stroke:#6b7280;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6b7280"/></marker></defs><rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="70" y="78">The receipt loop</text><text class="sub muted" x="70" y="112">A downstream page is not delivered until its id docks back upstream.</text>
  <rect class="card local" x="70" y="185" width="300" height="180" rx="16"/><text class="mono muted" x="95" y="220">LOCAL OUTBOX</text><text class="label ink" x="95" y="260">#41 · SHIPPED</text><text class="body muted" x="95" y="292">sync key: bridge:demo:41</text><rect x="95" y="315" width="250" height="30" rx="8" fill="#fffdf8" stroke="#8a5a2b"/><text class="mono muted" x="110" y="336">downstreamRef: empty</text>
  <path class="line" d="M380 275H505"/><text class="mono muted" x="414" y="238">key check</text><text class="mono muted" x="402" y="258">miss → create</text>
  <rect class="card remote" x="515" y="185" width="300" height="180" rx="16"/><text class="mono muted" x="540" y="220">REMOTE BUILD LOG</text><text class="label ink" x="540" y="260">page · Project A</text><text class="body muted" x="540" y="292">Sync Key: bridge:demo:41</text><rect x="540" y="315" width="250" height="30" rx="8" fill="#fffdf8" stroke="#24566d"/><text class="mono ink" x="555" y="336">page id: remote-page-1</text>
  <path class="line" d="M665 375V455H225V375"/><text class="mono muted" x="315" y="440">receipt: downstreamRef = remote-page-1</text>
  <rect class="card danger" x="70" y="505" width="500" height="160" rx="16"/><text class="mono" fill="#a23331" x="95" y="540">PRE-FIX CRASH WINDOW</text><text class="label ink" x="95" y="577">Create landed · receipt did not</text><text class="body muted" x="95" y="608">Retry could create remote-page-2 because it had</text><text class="body muted" x="95" y="633">no durable key check before writing.</text><path d="M455 545l70 70M525 545l-70 70" stroke="#a23331" stroke-width="5"/>
  <rect class="card good" x="630" y="505" width="500" height="160" rx="16"/><text class="mono" fill="#2f7d46" x="655" y="540">POST-FIX CONVERGENCE</text><text class="label ink" x="655" y="577">Retry queries the sync key first</text><text class="body muted" x="655" y="608">Existing page found → create is skipped → only the</text><text class="body muted" x="655" y="633">missing receipt is written back. Exactly one page.</text><path d="M1030 555l18 20 38-48" fill="none" stroke="#2f7d46" stroke-width="6"/>
  <text class="mono muted" x="70" y="716">THE RECEIPT IS THE QUEUE'S PROOF THAT DELIVERY CONVERGED</text>
</svg>

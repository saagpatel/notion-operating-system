<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The five-rung managed-section write ladder</title>
  <desc id="desc">The reconciler starts with a no-op equality check, then tries a targeted section swap, full safe replacement, insertion after a heading, and append after a unique tail. Transport ambiguity triggers read-back convergence.</desc>
  <style>.bg{fill:#fffdf8}.ink{fill:#24292e}.muted{fill:#6b7280}.local{fill:#fbf4e7;stroke:#8a5a2b}.remote{fill:#f2f8fa;stroke:#24566d}.danger{fill:#fff1ef;stroke:#a23331}.good{fill:#eef8ef;stroke:#2f7d46}.card{stroke-width:2}.title{font:700 42px system-ui,sans-serif}.sub{font:18px system-ui,sans-serif}.label{font:700 18px system-ui,sans-serif}.body{font:15px system-ui,sans-serif}.mono{font:14px ui-monospace,monospace;letter-spacing:.035em}.num{font:700 24px ui-monospace,monospace}.line{stroke:#6b7280;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6b7280"/></marker></defs><rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="70" y="78">The write ladder</text><text class="sub muted" x="70" y="112">Five ways to write one section, tried politest-first.</text>
  <path class="line" d="M155 204V650"/>
  <g><circle cx="155" cy="200" r="28" fill="#f4ead9" stroke="#8a5a2b" stroke-width="2"/><text class="num ink" x="147" y="208">1</text><rect class="card local" x="220" y="155" width="700" height="90" rx="14"/><text class="label ink" x="248" y="190">Normalized equality → no-op</text><text class="body muted" x="248" y="218">If remote already means the same thing, write nothing. The boring outcome is the preferred one.</text><rect class="card good" x="950" y="168" width="180" height="64" rx="12"/><text class="mono ink" x="978" y="207">CLEAN · 0 writes</text></g>
  <g><circle cx="155" cy="310" r="28" fill="#f4ead9" stroke="#8a5a2b" stroke-width="2"/><text class="num ink" x="147" y="318">2</text><rect class="card local" x="220" y="265" width="700" height="90" rx="14"/><text class="label ink" x="248" y="300">Targeted section swap</text><text class="body muted" x="248" y="328">Replace only the marker-fenced section. Preserve every other writer's owned content.</text><rect class="card remote" x="950" y="278" width="180" height="64" rx="12"/><text class="mono ink" x="979" y="317">smallest patch</text></g>
  <g><circle cx="155" cy="420" r="28" fill="#f4ead9" stroke="#8a5a2b" stroke-width="2"/><text class="num ink" x="147" y="428">3</text><rect class="card local" x="220" y="375" width="700" height="90" rx="14"/><text class="label ink" x="248" y="410">Full safe replacement</text><text class="body muted" x="248" y="438">Rebuild the page only after the child-reference guard proves nothing owned will be dropped.</text><rect class="card danger" x="950" y="388" width="180" height="64" rx="12"/><text class="mono ink" x="970" y="417">WAF may reject</text><text class="mono muted" x="1008" y="437">403</text></g>
  <g><circle cx="155" cy="530" r="28" fill="#f4ead9" stroke="#8a5a2b" stroke-width="2"/><text class="num ink" x="147" y="538">4</text><rect class="card local" x="220" y="485" width="700" height="90" rx="14"/><text class="label ink" x="248" y="520">Insert after the unique heading</text><text class="body muted" x="248" y="548">Use a blunter update shape anchored after H1 when content-sensitive patching is blocked.</text><rect class="card remote" x="950" y="498" width="180" height="64" rx="12"/><text class="mono ink" x="980" y="537">anchor fallback</text></g>
  <g><circle cx="155" cy="640" r="28" fill="#f4ead9" stroke="#8a5a2b" stroke-width="2"/><text class="num ink" x="147" y="648">5</text><rect class="card local" x="220" y="595" width="700" height="90" rx="14"/><text class="label ink" x="248" y="630">Append after a unique tail</text><text class="body muted" x="248" y="658">Shrink a verified-unique tail anchor until the section can be placed without guessing.</text><rect class="card remote" x="950" y="608" width="180" height="64" rx="12"/><text class="mono ink" x="984" y="647">last safe rung</text></g>
  <rect class="card good" x="430" y="700" width="700" height="42" rx="12"/><text class="mono ink" x="455" y="727">TRANSPORT ERROR? READ BACK → normalized equal → read_back_converged</text>
</svg>

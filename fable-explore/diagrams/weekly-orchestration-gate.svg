<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A broken preflight never escalates to writes</title>
  <desc id="desc">The weekly refresh always runs six dry-run lanes first. Live execution opens only when live was explicitly requested, preflight found drift worth writing, and no lane failed or returned partial status. Broken, partial, or no-op preflights stop without writes.</desc>
  <style>.bg{fill:#fffdf8}.ink{fill:#24292e}.muted{fill:#6b7280}.local{fill:#fbf4e7;stroke:#8a5a2b}.remote{fill:#f2f8fa;stroke:#24566d}.danger{fill:#fff1ef;stroke:#a23331}.good{fill:#eef8ef;stroke:#2f7d46}.card{stroke-width:2}.title{font:700 42px system-ui,sans-serif}.sub{font:18px system-ui,sans-serif}.label{font:700 19px system-ui,sans-serif}.body{font:16px system-ui,sans-serif}.mono{font:13px ui-monospace,monospace;letter-spacing:.03em}.line{stroke:#6b7280;stroke-width:3;fill:none;marker-end:url(#arrow)}.stop{stroke:#a23331}.go{stroke:#2f7d46}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6b7280"/></marker></defs><rect class="bg" width="1200" height="760"/>
  <text class="title ink" x="70" y="78">A broken preflight never escalates</text><text class="sub muted" x="70" y="112">Weekly maintenance is a two-phase gate: observe everything dry, then write only what passed.</text>
  <rect class="card local" x="70" y="175" width="270" height="425" rx="16"/><text class="mono muted" x="95" y="212">PHASE 1 · ALWAYS DRY</text><text class="label ink" x="95" y="248">Full preflight</text>
  <g class="body ink"><text x="105" y="292">1 · support maintenance</text><text x="105" y="337">2 · control tower</text><text x="105" y="382">3 · execution sync</text><text x="105" y="427">4 · intelligence sync</text><text x="105" y="472">5 · review packet</text><text x="105" y="517">6 · external signals</text></g>
  <text class="mono muted" x="95" y="565">writes: 0</text>
  <path class="line" d="M350 387H445"/>
  <path d="M545 245l100 70v145l-100 70-100-70V315z" fill="#f2f8fa" stroke="#24566d" stroke-width="2"/><text class="mono muted" x="496" y="330">GATE</text><text class="body ink" x="478" y="365">live requested?</text><text class="body ink" x="473" y="397">drift found?</text><text class="body ink" x="469" y="429">no failed/partial?</text>
  <path class="line stop" d="M545 535V630"/><rect class="card danger" x="345" y="640" width="400" height="70" rx="14"/><text class="label ink" x="375" y="672">Stop · zero writes</text><text class="mono muted" x="375" y="696">broken · partial · clean/no-op · no approval</text>
  <path class="line go" d="M650 387H745"/><rect class="card good" x="755" y="175" width="375" height="425" rx="16"/><text class="mono" fill="#2f7d46" x="780" y="212">PHASE 2 · GUARDED LIVE</text><text class="label ink" x="780" y="248">Run approved drifting lanes</text><text class="body muted" x="780" y="286">Same fixed order. Control-tower</text><text class="body muted" x="780" y="310">failure skips every dependent lane.</text>
  <rect x="780" y="350" width="325" height="60" rx="10" fill="#fffdf8" stroke="#2f7d46"/><text class="mono ink" x="800" y="376">status: completed | clean</text><text class="mono muted" x="800" y="397">writes: only verified drift</text>
  <rect x="780" y="435" width="325" height="95" rx="10" fill="#fffdf8" stroke="#24566d"/><text class="mono ink" x="800" y="462">after each write</text><text class="body muted" x="800" y="490">read back / receipt / convergence</text><text class="body muted" x="800" y="514">or fail loudly</text>
  <text class="mono muted" x="70" y="735">DRY RUN IS AN ANTI-ENTROPY AUDIT · LIVE IS A SEPARATE, EXPLICIT PHASE</text>
</svg>
